# skout: hand-authored reference set for theme spec labels.
#
# Authored 2026-08-25 from `poc labels --store skout`. The six per-product labels were
# written before any classifier ran; `The Bad News` and `The Good News` were added
# afterwards but before the classifier was shown them. This file is both the input to the
# `static` policy and the ground truth the `llm` policy is scored against. Editing it after
# seeing model output invalidates the scores, so any such edit must be recorded, as the one
# below is.
#
#   spec       a durable property of the product; may become quotable
#   widget     storefront control, page title or marketing heading; never stored
#   uncertain  genuine product content that is not a checkable property; retrieval only
#
# `Pack Size` and `Size` were authored as `widget` on 2026-08-25 and changed to `spec` the
# same day by product decision, after the measurement showed suppressing them cost two
# scoped answers. They remain variant selectors; the decision is that quoting the available
# pack sizes to a shopper is acceptable and useful. It makes 111 picker values quotable.
# Reverse by setting both back to `widget`.
#
# This change happened AFTER the classifier was scored against this file. Measured against the
# file as originally authored, gpt-4o-mini agreed on 4 of 6 confident calls here and gpt-5.5 on
# 6 of 6; against the file as it now stands gpt-4o-mini would read better. That is the reference
# moving toward one model, not evidence that model was right, and the two must not be conflated.

labels:
  "About the shirt": uncertain
  "Delivery Frequency": widget
  "Pack Size": spec
  "Pro Tip": uncertain
  "Size": spec
  "The Bad News": widget
  "The Good News": widget
  "This item": widget
