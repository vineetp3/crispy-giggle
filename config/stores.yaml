# Non-secret store settings. Tokens live in PIER39_SHOPIFY_TOKENS (see .env.example).
#
# Any default below can be overridden per store. Override only where the stores
# demonstrably differ: fetch_profile, the page budget, and chrome_threshold.

defaults:
  admin_api_version: "2026-01"

  # Page budget. "pages per store" is three settings, because they answer
  # different questions.
  # Measured 2026-08-25: skout's full catalogue is 152 pages in 5m43s, 0 failures.
  # Chromium rendering dominates at ~10s/page; raw HTTP is 0.6-0.9s.
  # Sampling was never a cost control -- profile_pages drives differencing quality.
  # Both pilot stores therefore run crawl_scope: all. Sampling is retained for
  # stores large enough to need it. See DESIGN.md 5.2.
  profile_pages: 40 # pages used to derive the boilerplate profile + allowlist
  crawl_scope: sample # none | sample | template_representatives | all
  max_pages: 500 # hard ceiling, independent of crawl_scope

  sampling: by_template # by_template | by_product_type | random | first_n | explicit
  sampling_seed: 1739
  explicit_handles: [] # used when sampling == explicit

  # Fetching
  fetch_profile: plain # plain | stealth | undetected
  concurrency: 4
  delay_seconds: [1.0, 3.0]
  page_timeout_ms: 45000
  # Escalation pacing. Without these the ladder re-hammers a rate-limited batch
  # three times back to back, turning one 429 into three.
  escalation_cooldown_seconds: 30.0 # pause between profile rungs
  final_retry_delay_seconds: 60.0 # pause before the serial straggler pass

  # Indexing
  embedding_model: text-embedding-3-large
  embedding_dimensions: 1024
  rerank_model: ms-marco-MiniLM-L-12-v2

  # Algorithm thresholds. Everything above is an operational setting -- a budget, a
  # profile, a model name. Everything here changes the ANSWER for the same catalogue.
  # Defaults and the reasoning for each: src/pier39_poc/core/tuning.py.
  # Override a single group per store; the other groups are inherited.
  tuning:
    blocks:
      chrome_threshold: 0.8 # MUST NOT be 1.0 -- see DESIGN.md 5.3
      min_block_chars: 3
      cross_page_min_pages: 3
      cross_page_min_words: 20
      max_label_words: 4
    matching:
      containment_threshold: 0.8
      min_candidate_tokens: 2
      min_candidate_chars: 8
      window_slack: 2.0
      min_window: 6
      min_prose_tokens_for_title_check: 15
    quotability:
      quotable_max_tokens: 8
      theme_quotable_max_tokens: 15
    crawl:
      group_floor: 3
    profiling:
      allowlist_min_support: 3
      allowlist_min_hit_rate: 0.8
      foreign_title_reject_rate: 0.25
      label_min_observations: 2
      label_min_dominance: 0.8
      spec_value_max_tokens: 25
    documents:
      max_field_chars: 1200
    retrieval:
      rrf_k: 60
      first_stage_limit: 200
      live_read_limit: 60
      rerank_doc_chars: 4000
    chat:
      max_retrieval_shown: 12
    llm:
      default_budget: 512
    evaluation:
      significance_max_p: 0.05

stores:
  - slug: skout
    domain: skout-development.myshopify.com
    enabled: true
    fetch_profile: plain
    crawl_scope: all

  - slug: remi
    domain: remi-club.myshopify.com
    enabled: true
    fetch_profile: stealth
    crawl_scope: all
    concurrency: 2
    delay_seconds: [2.0, 5.0]

  - slug: thighsociety
    domain: thighsociety.myshopify.com
    enabled: true
    fetch_profile: plain
    crawl_scope: all
    concurrency: 1
    delay_seconds: [2.0, 5.0]

  - slug: trueclassic
    domain: trueclassictees-com.myshopify.com
    enabled: true
    fetch_profile: plain
    crawl_scope: all
    concurrency: 4
    delay_seconds: [2.0, 5.0]

  - slug: countrylife
    domain: countrylifefoods.com
    enabled: false # easy case; API already covers it. Kept for comparison.
    crawl_scope: none
