services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pier39
      POSTGRES_PASSWORD: pier39
      POSTGRES_DB: discovery
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pier39 -d discovery"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
